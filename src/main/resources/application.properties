spring.application.name=mandi-connect-api
server.port=8080

# ---- MySQL (default) ----
# Change username/password below, or set env vars DB_USERNAME / DB_PASSWORD / DB_URL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mandi_connect?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Rosh@321}

# ---- JPA / Hibernate ----
# "update" creates tables automatically on first run and keeps existing data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# ---- Login (JWT) ----
# Secret used to sign login tokens (must be at least 32 characters). Change it for real use.
app.jwt.secret=${JWT_SECRET:mandi-connect-demo-secret-key-change-me-0123456789}
# token validity: 1 day
app.jwt.expiration-ms=86400000
